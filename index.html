<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Flatpickr CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div id="container1">
        <!-- header -->
        <div class="socialMedia"> 
            <div class="container">
                <ul>
                    <li><a href="https://www.meta.com/your-profile" target="_blank"><i class="fa-brands fa-meta"></i></a></li>
                    <li><a href="www.linkedin.com/in/antony-mantiri" target="_blank"><i class="fa-brands fa-linkedin"></i></a></li>
                    <li><a href="https://www.twitter.com/your-profile" target="_blank"><i class="fa-brands fa-x-twitter"></i></a></li>
                </ul>
            </div>
        </div>
    <header>
        <div class="container">
            <h1><a href="index.html">Coffee&Chat</a></h1>  
                <ul>
                    <li class="active"><a href="index.html" target="_blank">Home</a></li>
                    <li><a href="aboutUs.html"target="_blank">About Us</a></li>
                    <li><a href="service.html"target="_blank">Service</a></li>
                    <li><a href="contact.html"target="_blank">Contact</a></li>
                    <li><a href="meetTheTeam.html"target="_blank">Community Forums</a></li>
                </ul>
        </div>
    </header>
    <!-- banner -->
    <section class="banner">
        <h3>Are you a single parent? <br> We are supporting you</h3>
    </section>

    <!-- Appointment Scheduler -->
    <section class="appointment-scheduler">
        <div class="container">
            <h2>Schedule an Appointment</h2>
            <form id="appointment-form">
                <label for="name">Your Name:</label>
                <input type="text" id="name" placeholder="Enter your name" required>

                <label for="email">Your Email:</label>
                <input type="text" id="email" placeholder="Enter your email" required>

                <label for="appointment-date">Appointment Date & Time:</label>
                <input type="text" id="appointment-date" placeholder="Select date and time" required>

                <button type="submit">Schedule Appointment</button>
            </form>
            <div id="confirmation-message" style="display: none; margin-top: 20px; color: green;">
                Appointment scheduled successfully!
            </div>
        </div>
    </section>

    <!-- footer -->
    <footer>
        <div class="container">
            <small>Copyright Coffee&Chat 2024</small>
        </div>
    </footer>
</div>

<!-- Flatpickr JS -->
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<!-- custom JS -->
<script src="script.js"></script>
</body>
